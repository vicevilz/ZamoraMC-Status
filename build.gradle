plugins {
    id 'com.gradleup.shadow' version '9.0.0' apply false
}

allprojects {
    group = 'com.vicevil'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java'

    java {
        // The dependency graph must resolve Paper 26.2 (Java 25), while compiler release remains 21.
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        toolchain {
            // Paper 26.2's API is published for Java 25; release below keeps plugin bytecode at Java 21.
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
        maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
        maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        filesMatching(['plugin.yml', 'velocity-plugin.json']) {
            expand(version: project.version)
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }
}
